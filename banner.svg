  <text x="448" y="140" font-family="monospace" font-size="52" font-weight="bold" fill="#ff0080" text-anchor="middle" opacity="0.7">Kero Nader<animate attributeName="x" values="448;452;446;450;448" dur="0.5s" repeatCount="indefinite"/></text>
  <text x="452" y="140" font-family="monospace" font-size="52" font-weight="bold" fill="#00ff80" text-anchor="middle" opacity="0.5">Kero Nader<animate attributeName="x" values="452;448;454;450;452" dur="0.7s" repeatCount="indefinite"/></text>
  <text x="450" y="185" font-family="monospace" font-size="18" fill="#80ffff" text-anchor="middle" opacity="0.9">Cybersecurity | Full Stack | DevOps | Embedded and IoT<animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/></text>
