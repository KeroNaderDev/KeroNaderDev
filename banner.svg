    </linearGradient>
    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff00ff"/><stop offset="100%" style="stop-color:#ff0080"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" fill="url(#bgGrad)"/>
  <g opacity="0.15">
