    <text x="650" y="260" font-family="monospace" font-size="10" fill="#ff00ff">ACCESS GRANTED // PORTFOLIO v2.0<animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/></text>
