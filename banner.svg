    <circle cx="870" cy="85" r="2" fill="#00ff00"/><line x1="868" y1="85" x2="830" y2="85" stroke="#ff00ff" stroke-width="1"/>
    <circle cx="825" cy="85" r="3" fill="#ff00ff"/>
