<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000a00"/><stop offset="100%" style="stop-color:#001a0a"/>
    </linearGradient>
    <filter id="glow3"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="200" fill="url(#bg3)"/>
  <g font-family="monospace" font-size="12" fill="#00ff00" opacity="0.3">
    <text x="20" y="20">0 1 1 0 1 0 0 1<animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite"/></text>
    <text x="480" y="30">1 0 1 1 0 1 0 0<animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.8s" repeatCount="indefinite"/></text>
    <text x="100" y="180">1 1 0 0 1 0 1 1<animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.2s" repeatCount="indefinite"/></text>
    <text x="400" y="175">0 0 1 1 0 1 1 0<animate attributeName="opacity" values="0.3;0.6;0.3" dur="1.6s" repeatCount="indefinite"/></text>
  </g>
  <g transform="translate(270, 55)" filter="url(#glow3)">
    <path d="M0,10 L30,0 L60,10 L60,40 C60,60 30,75 30,75 C30,75 0,60 0,40 Z" fill="none" stroke="#00ff00" stroke-width="2"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></path>
    <path d="M20,30 L28,40 L42,22" fill="none" stroke="#00ff80" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0,50;50,0" dur="2s" repeatCount="indefinite"/></path>
  </g>
  <text x="300" y="45" font-family="monospace" font-size="30" font-weight="bold" fill="#00ff00" text-anchor="middle" filter="url(#glow3)">CYBERSECURITY<animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/></text>
  <text x="300" y="155" font-family="monospace" font-size="14" fill="#00cc80" text-anchor="middle">Penetration Testing | Ethical Hacking | Network Security</text>
  <g transform="translate(130, 130)">
    <rect x="0" y="10" width="20" height="15" fill="none" stroke="#00ff00" stroke-width="1.5" rx="2"/>
    <path d="M4,10 L4,6 C4,2 16,2 16,6 L16,10" fill="none" stroke="#00ff00" stroke-width="1.5"><animate attributeName="d" values="M4,10 L4,6 C4,2 16,2 16,6 L16,10;M4,10 L4,8 C4,4 16,4 16,8 L16,10" dur="2s" repeatCount="indefinite"/></path>
  </g>
  <g transform="translate(400, 130)">
    <rect x="0" y="0" width="160" height="30" fill="none" stroke="#00ff00" stroke-width="1" rx="3" opacity="0.5"/>
    <text x="10" y="20" font-family="monospace" font-size="10" fill="#00ff00">$ sudo access granted_<animate attributeName="opacity" values="0.6;1;0.6" dur="1s" repeatCount="indefinite"/></text>
  </g>
  <rect x="0" y="0" width="600" height="2" fill="#00ff00" opacity="0.3"><animate attributeName="y" values="0;200;0" dur="5s" repeatCount="indefinite"/></rect>
</svg>
